# ===== Datasource =====
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false
# ===== Actuator =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== OpenAPI / Swagger =====
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
app.swagger.server-url=${SWAGGER_SERVER_URL:http://localhost:8080}

# ===== CORS =====
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# ===== Server =====
server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=native

# ===== Metrics =====
# IDs del seed V2: 1=Sentadilla Low Bar, 15=Bench Press, 30=Peso Muerto Convencional
metrics.reference-maxes={1: 150.0, 15: 90, 30: 175}
metrics.comp-lifts={SQUAT: 1, BENCH: 15, DEADLIFT: 30}
metrics.hard-set-rpe-threshold=8.0
metrics.e1rm-formula=EPLEY
bodyweight.default=81.9
athleteId=1;

